name: Build Android 13 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Modify minSdk from 34 to 33 (Android 13)
      - name: Lower minSdk for Android 13
        run: |
          sed -i 's/minSdk = 34/minSdk = 33/g' app/build.gradle.kts

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthConnectExports-Android13
          path: app/build/outputs/apk/debug/app-debug.apk
